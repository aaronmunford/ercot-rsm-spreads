[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ercot-rsm"
version = "0.1.0"
description = "Response surface regression of ERCOT zonal DA-RT spreads and implied heat rates on temperature, load and natural gas prices"
readme = "README.md"
authors = [{ name = "Aaron Munford" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "pyarrow>=15",
  "requests>=2.32",
  "gridstatusio>=0.16",
  "xlrd>=2.0",  # EIA history workbooks are legacy .xls
  "openpyxl>=3.1",  # ERCOT native-load archive is .xlsx
  "python-calamine>=0.2",  # fast reader for the ERCOT annual price workbooks
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29", "jupyterlab>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
